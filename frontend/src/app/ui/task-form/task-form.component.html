<div
  class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center bg-neo-blue-dark/60 p-4"
  (click)="onBackdropClick($event)"
>
  <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="font-display text-xl font-semibold text-neo-blue-dark">
        {{ task ? 'Edit Task' : 'New Task' }}
      </h2>
      <button
        app-icon-button
        (click)="onClose()"
        aria-label="Fermer"
      >
        <svg lucideX class="h-5 w-5" aria-hidden="true"></svg>
      </button>
    </div>

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <div>
        <label class="mb-1 block text-sm font-medium text-neo-blue-dark" for="task-title">Title *</label>
        <input
          id="task-title"
          [(ngModel)]="title"
          name="title"
          type="text"
          required
          class="w-full rounded-full border border-neo-blue-dark/40 bg-white px-4 py-2.5 text-sm text-neo-blue-dark placeholder:text-neo-blue-dark/60 focus:border-neo-blue focus:outline-none focus:ring-2 focus:ring-neo-blue/30"
          placeholder="Task title"
        />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-neo-blue-dark" for="task-description">Description</label>
        <textarea
          id="task-description"
          [(ngModel)]="description"
          name="description"
          rows="3"
          class="w-full rounded-2xl border border-neo-blue-dark/40 bg-white px-4 py-2.5 text-sm text-neo-blue-dark placeholder:text-neo-blue-dark/60 focus:border-neo-blue focus:outline-none focus:ring-2 focus:ring-neo-blue/30"
          placeholder="Task description"
        ></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="mb-1 block text-sm font-medium text-neo-blue-dark" for="task-status">Status *</label>
          <div class="relative">
            <select
              id="task-status"
              [(ngModel)]="status"
              name="status"
              class="w-full appearance-none rounded-full border border-neo-blue-dark/40 bg-white py-2.5 pl-4 pr-9 text-sm text-neo-blue-dark focus:border-neo-blue focus:outline-none focus:ring-2 focus:ring-neo-blue/30"
            >
              @for (status of statuses; track status) {
                <option [value]="status">{{ status }}</option>
              }
            </select>
            <svg
              lucideChevronDown
              class="pointer-events-none absolute right-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-neo-blue-dark/60"
              aria-hidden="true"
            ></svg>
          </div>
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-neo-blue-dark" for="task-priority">Priority</label>
          <div class="relative">
            <select
              id="task-priority"
              [(ngModel)]="priority"
              name="priority"
              class="w-full appearance-none rounded-full border border-neo-blue-dark/40 bg-white py-2.5 pl-4 pr-9 text-sm text-neo-blue-dark focus:border-neo-blue focus:outline-none focus:ring-2 focus:ring-neo-blue/30"
            >
              @for (priority of priorities; track priority) {
                <option [value]="priority">{{ priority }}</option>
              }
            </select>
            <svg
              lucideChevronDown
              class="pointer-events-none absolute right-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-neo-blue-dark/60"
              aria-hidden="true"
            ></svg>
          </div>
        </div>
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-neo-blue-dark" for="task-due-date">Due Date</label>
        <input
          id="task-due-date"
          [(ngModel)]="dueDate"
          name="dueDate"
          type="date"
          class="w-full rounded-full border border-neo-blue-dark/40 bg-white px-4 py-2.5 text-sm text-neo-blue-dark focus:border-neo-blue focus:outline-none focus:ring-2 focus:ring-neo-blue/30"
        />
      </div>

      <div class="flex justify-end gap-3">
        <button
          type="button"
          app-pill-button
          variant="secondary"
          (click)="onClose()"
        >
          Cancel
        </button>
        <button
          type="submit"
          app-pill-button
          variant="primary"
          [disabled]="!title || isLoading()"
        >
          {{ isLoading() ? 'Saving...' : (task ? 'Update' : 'Create') }}
        </button>
      </div>
    </form>
  </div>
</div>
