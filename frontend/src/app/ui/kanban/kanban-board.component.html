<div class="min-h-screen">
  <!-- Header aurora -->
  <header class="aurora-header sticky top-0 z-10 shadow-sm">
    <div class="mx-auto flex h-16 max-w-7xl items-center gap-3 px-4">
      <img src="neosoft-logo-white.svg" alt="Néosoft" class="h-6 w-auto" />
      <span class="h-5 w-px bg-white/30 sm:h-6" aria-hidden="true"></span>
      <h1 class="truncate font-display text-base font-semibold text-white sm:text-2xl">Task Board</h1>
      <div class="ml-auto">
        <button
          app-pill-button
          variant="on-dark"
          size="sm"
          (click)="openCreateForm()"
        >
          + New Task
        </button>
      </div>
    </div>
  </header>

  <!-- Kanban Columns -->
  <main class="mx-auto max-w-7xl p-4 sm:p-6">
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
      @for (column of columns; track column) {
        <div class="rounded-2xl border border-neo-blue-light bg-white/70 p-4">
          <!-- Column Header -->
          <div class="mb-4 flex items-center justify-between">
            <h2 class="font-display font-semibold text-neo-blue-dark">{{ getColumnTitle(column) }}</h2>
            <span class="rounded-full border border-neo-blue-light bg-white px-2.5 py-0.5 text-xs text-neo-blue-dark/80">
              {{ tasksByStatus()[column].length }}
            </span>
          </div>

          <!-- Task List -->
          <div class="flex flex-col gap-3">
            @for (task of tasksByStatus()[column]; track task.id) {
              <app-task-card
                [task]="task"
                (edit)="openEditForm($event)"
                (delete)="onTaskDeleted()"
                (statusChange)="onStatusChange($event.task, $event.status)"
              />
            } @empty {
              <p class="py-4 text-center text-sm text-neo-blue-dark/60">No tasks</p>
            }
          </div>
        </div>
      }
    </div>
  </main>

  <!-- Modal Form -->
  @if (showForm()) {
    <app-task-form
      [task]="editingTask()"
      (close)="closeForm()"
      (saved)="onTaskSaved()"
    />
  }
</div>
